<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>LINE認証・認可 結合試験</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{font:16px/1.6 system-ui,sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem;color:#182230}button{width:100%;font:inherit;padding:.7rem;margin:.5rem 0}[role=status]{padding:1rem;background:#f2f4f7;min-height:2em}.note{color:#475467}.result-frame{display:block;width:100%;height:8rem;border:1px solid #98a2b3;border-radius:.4rem;background:#fff;margin:1rem 0}</style></head><body><h1>LINE認証・認可 結合試験</h1><p class="note">専用の隔離試験用です。GAS設定・公開範囲・実行履歴の確認後にのみ使用してください。送信後は下の結果欄に表示される固定の判定コードを確認します。</p><p id="status" role="status" aria-live="polite">LIFF SDKを読み込んでいます。</p><button id="employee" disabled>従業員本人scopeを確認</button><button id="manager" disabled>manager明示scopeを確認</button><h2>隔離GASの判定結果</h2><p class="note">この欄には固定の判定コードだけが表示されます。</p><iframe class="result-frame" name="gas-result" id="gas-result" title="隔離GASの判定結果"></iframe><form id="gas-form" method="post" target="gas-result" hidden><input name="id_token"><input name="mode" value="identity"><input name="employeeId"><input name="role"></form><script>
const LIFF_ID='2012227652-CgVMkyBb', ALLOWED_GAS_ENDPOINT='https://script.google.com/macros/s/AKfycbyYF3M3h3-0SirlvBP24vGW42HC1IAlzm-b9rVLl2JzWuSNmgzlO9OP1f3CGCZdUVmj/exec';
const statusNode=document.getElementById('status'),buttons=[document.getElementById('employee'),document.getElementById('manager')],form=document.getElementById('gas-form');
let liffReady=false;
function show(t){statusNode.textContent=t;}
function approved(){try{const u=new URL(ALLOWED_GAS_ENDPOINT);return ALLOWED_GAS_ENDPOINT!=='REPLACE_WITH_REVIEWED_GAS_EXEC_URL'&&u.href===ALLOWED_GAS_ENDPOINT&&u.protocol==='https:'&&u.hostname==='script.google.com'&&!u.port&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname)&&!u.username&&!u.password&&!u.search&&!u.hash;}catch(_){return false;}}
function failInitialization(message){liffReady=false;buttons.forEach(b=>b.disabled=true);show(message);}
async function initialize(){
 if(!approved()||LIFF_ID==='REPLACE_WITH_LIFF_ID'){failInitialization('試験設定が未完了です。送信機能は停止中です。');return;}
 if(!window.liff){failInitialization('LIFF SDKを読み込めませんでした。通信状態を確認してページを再読み込みしてください。送信していません。');return;}
 show('LIFFを初期化しています。');
 try{
  await Promise.race([liff.init({liffId:LIFF_ID}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('LIFF_INIT_TIMEOUT')),15000))]);
  liffReady=true;
  buttons.forEach(b=>b.disabled=false);
  show(liff.isLoggedIn()?'初期化が完了しました。確認するscopeを選択してください。':'初期化が完了しました。LINEへログイン後、確認するscopeを選択してください。');
 }catch(_){failInitialization('LIFFを初期化できませんでした。LINE内ブラウザーまたは通信状態を確認してページを再読み込みしてください。送信していません。');}
}
async function run(role){
 if(!liffReady||!window.liff){failInitialization('LIFFの初期化が完了していません。送信していません。');return;}
 if(!approved()){failInitialization('試験設定を確認できません。送信していません。');return;}
 if(!confirm('LINE ID tokenを隔離GASへPOST送信します。GAS実行履歴で結果を確認してください。続行しますか？')){show('送信を中止しました。');return;}
 buttons.forEach(b=>b.disabled=true);show('LINEログイン状態を確認しています。');
 try{
  if(!liff.isLoggedIn()){show('LINEへログインしてから再試行してください。');return;}
  const token=liff.getIDToken();if(!token){show('ID tokenを取得できません。送信していません。');return;}
  form.action=ALLOWED_GAS_ENDPOINT;form.elements.id_token.value=token;form.elements.employeeId.value=role==='employee'?'EMP-A':'EMP-B';form.elements.role.value=role;
  show('隔離GASへ送信しました。下の結果欄を確認してください。');form.submit();
 }catch(_){show('送信できませんでした。通信または設定を確認してください。');}
 finally{form.elements.id_token.value='';buttons.forEach(b=>b.disabled=!liffReady);}
}
document.getElementById('employee').onclick=()=>run('employee');document.getElementById('manager').onclick=()=>run('manager');
initialize();
</script></body></html>
