<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勤務予定</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{font-family:system-ui,sans-serif;background:#f4f7f5;color:#202b26;margin:0}main{max-width:600px;margin:auto;padding:20px}article{background:white;border-radius:12px;padding:16px;margin:12px 0}label{display:block;margin:10px 0}input,button{font:inherit;padding:10px}button{background:#06a94d;color:white;border:0;border-radius:8px;min-height:44px}button:disabled{opacity:.5}#status{white-space:pre-wrap}</style></head><body><main><h1>勤務予定</h1><p>試作版：テスト用の予定を表示します。</p><section id="setup"><p>試験管理者が接続先を確認して入力してください。</p><label>LIFF ID <input id="liffId" autocomplete="off"></label><label>隔離GASのWebアプリURL <input id="gasUrl" type="url" autocomplete="off"></label><button id="connect" type="button">接続</button></section><p id="status" role="status" aria-live="polite">LINEに接続しています…</p><form id="enrollment" hidden><label>管理者から受け取った登録コード <input id="enrollmentCode" autocomplete="one-time-code" maxlength="100" required></label><button>利用登録</button></form><button id="reload" disabled>予定を再読み込み</button><div id="list"></div></main>
<script>
'use strict';
// Set these only in a separately reviewed test deployment, not in a public commit.
const LIFF_ID = 'REPLACE_WITH_TEST_LIFF_ID';
const GAS_URL = 'REPLACE_WITH_ISOLATED_GAS_EXEC_URL';
let token='', busy=false;
const status=document.getElementById('status'), list=document.getElementById('list'), reload=document.getElementById('reload');
const messages={REGISTRATION_INVALID:'登録コードを確認できません。',ALREADY_REGISTERED:'このLINEアカウントは登録済みです。',DISABLED:'機能が停止中です。',AUTHENTICATION_FAILED:'LINE本人確認に失敗しました。',AUTHORIZATION_DENIED:'利用者設定を確認できません。',NOT_FOUND:'対象の予定を確認できません。',CONFLICT:'他の操作で更新されました。再読み込みしてください。',UNAVAILABLE:'処理できませんでした。管理者に確認してください。',INVALID_REQUEST:'入力を確認してください。'};
async function api(fields){const body=new URLSearchParams({id_token:token,...fields});const r=await fetch(GAS_URL,{method:'POST',body,redirect:'follow',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('通信結果を確認できません。');const result=await r.json();if(!result.ok){const err=Error(messages[result.code]||'処理できませんでした。');err.code=result.code;throw err;}return result;}
function render(records){list.replaceChildren();if(!records.length){list.textContent='表示できる予定はありません。';return;}for(const row of records){const card=document.createElement('article'),title=document.createElement('strong');title.textContent=row.workDate+'　'+row.employeeId;card.appendChild(title);const form=document.createElement('form');const inputs=[];for(const [caption,value] of [['開始',row.startTime],['終了',row.endTime]]){const label=document.createElement('label');label.textContent=caption+' ';const input=document.createElement('input');input.type='time';input.required=true;input.value=value;label.appendChild(input);form.appendChild(label);inputs.push(input);}const button=document.createElement('button');button.textContent='時間を保存';form.appendChild(button);form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;button.disabled=true;try{await api({action:'update',scheduleId:row.scheduleId,revision:String(row.revision),startTime:inputs[0].value,endTime:inputs[1].value});status.textContent='保存しました。';await load(false);}catch(err){status.textContent=err.message+' 保存結果が不明な場合は再読み込みして確認してください。';}finally{busy=false;button.disabled=false;}});card.appendChild(form);list.appendChild(card);}}
async function load(show=true){try{const data=await api({action:'list'});render(data.records);if(show)status.textContent='予定を表示しています。';}catch(e){list.replaceChildren();if(e.code==='AUTHORIZATION_DENIED')document.getElementById('enrollment').hidden=false;status.textContent=e.message;}}
document.getElementById('enrollment').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;const input=document.getElementById('enrollmentCode');try{await api({action:'register',registrationCode:input.value.trim()});input.value='';document.getElementById('enrollment').hidden=true;await load();}catch(err){input.value='';status.textContent=err.message+' 結果が不明な場合は管理者に確認してください。';}finally{busy=false;}});
reload.addEventListener('click',()=>load());
async function start(){try{if(LIFF_ID.startsWith('REPLACE_')||GAS_URL.startsWith('REPLACE_'))throw Error('試験環境が設定されていません。');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return;}token=liff.getIDToken()||'';if(!token)throw Error('LINE本人確認情報を取得できません。');reload.disabled=false;await load();}catch(e){status.textContent=e.message||'接続できませんでした。';}}
document.getElementById('connect').addEventListener('click',()=>{const li=document.getElementById('liffId'),url=document.getElementById('gasUrl');LIFF_ID=li.value.trim();GAS_URL=url.value.trim();try{const target=new URL(GAS_URL);if(target.protocol!=='https:'||target.hostname!=='script.google.com'||!/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(target.pathname)||target.search||target.hash||!/^\d+-[A-Za-z0-9_-]+$/.test(LIFF_ID))throw Error();}catch(_){status.textContent='LIFF IDと隔離GASのURLを確認してください。';return;}li.value='';url.value='';document.getElementById('setup').hidden=true;start();});
</script></body></html>
