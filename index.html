<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>LIFF 初期化確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17202a; background: #f5f7f8; }
    body { margin: 0; padding: 20px; }
    main { max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #d9e0e5; border-radius: 12px; padding: 18px; margin: 14px 0; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { line-height: 1.6; }
    ol { padding-left: 1.5rem; }
    li { margin: .55rem 0; }
    button { width: 100%; min-height: 46px; border: 0; border-radius: 8px; background: #06c755; color: #fff; font: inherit; font-weight: 700; }
    button:disabled { opacity: .55; }
    .muted { color: #53616b; font-size: .92rem; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>LIFF 初期化確認</h1>
    <p class="muted">このページはLINE SDKの読み込み、LIFF初期化、ログイン状態だけを確認します。プロフィールやIDトークンの取得、GAS通信は行いません。</p>
  </section>
  <section class="card" aria-live="polite">
    <strong id="summary">準備しています…</strong>
    <ol id="steps"></ol>
    <button id="login" type="button" hidden>LINEでログイン</button>
  </section>
  <section class="card muted">
    <p>設定値: <code id="liff-id-status">確認中</code></p>
    <p>実行URL: <code id="page-url"></code></p>
    <p>URLのクエリやフラグメントは表示・保存しません。</p>
  </section>
</main>
<script>
(() => {
  'use strict';
  // Enter the existing LIFF ID here after creating this branch. It is an app identifier,
  // not a secret. Never put channel secrets, access tokens, or ID tokens in this file.
  const LIFF_ID = '2012227652-CgVMkyBb';
  const TIMEOUT_MS = 30000;
  const summary = document.getElementById('summary');
  const steps = document.getElementById('steps');
  const loginButton = document.getElementById('login');

  // Show only origin and path; LIFF query parameters and fragments can contain transient values.
  document.getElementById('page-url').textContent = location.origin + location.pathname;

  function addStep(name, result) {
    const item = document.createElement('li');
    item.textContent = name + '：' + result;
    steps.appendChild(item);
  }

  function withTimeout(promise, label) {
    let timer;
    return Promise.race([
      promise,
      new Promise((_, reject) => {
        timer = window.setTimeout(() => reject(new Error(label + 'が30秒以内に完了しませんでした')), TIMEOUT_MS);
      })
    ]).finally(() => window.clearTimeout(timer));
  }

  async function run() {
    if (!LIFF_ID || LIFF_ID === 'REPLACE_WITH_LIFF_ID') {
      document.getElementById('liff-id-status').textContent = '未設定';
      summary.textContent = 'LIFF IDを設定してください。';
      addStep('設定確認', '未完了');
      return;
    }
    document.getElementById('liff-id-status').textContent = '設定済み（値は非表示）';

    if (typeof window.liff === 'undefined') {
      addStep('LINE SDK読み込み', '失敗');
      summary.textContent = 'LINE SDKを読み込めませんでした。通信環境を確認してください。';
      return;
    }
    addStep('LINE SDK読み込み', '完了');

    try {
      await withTimeout(window.liff.init({ liffId: LIFF_ID }), 'LIFF初期化');
      addStep('LIFF初期化', '完了');
      const loggedIn = window.liff.isLoggedIn();
      addStep('ログイン状態', loggedIn ? 'ログイン済み' : '未ログイン');
      if (loggedIn) {
        summary.textContent = 'LIFF初期化に成功しました。LINEログイン済みです。';
        return;
      }
      summary.textContent = 'LIFF初期化に成功しました。LINEログインを確認してください。';
      loginButton.hidden = false;
    } catch (error) {
      // Display only a short, sanitized message. Never print SDK objects or token-bearing URLs.
      const safeMessage = error && typeof error.message === 'string'
        ? error.message.replace(/https?:\/\/[^\s]+/g, '[URL省略]').slice(0, 240)
        : '詳細不明のエラー';
      addStep('LIFF初期化', '失敗: ' + safeMessage);
      summary.textContent = 'LIFF初期化に失敗しました。登録URLと現在のホストを確認してください。';
    }
  }

  loginButton.addEventListener('click', () => window.liff.login());
  run();
})();
</script>
</body>
</html>
