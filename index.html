<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>LINE勤怠</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{font-family:system-ui,sans-serif;color:#202b26;background:#f4f7f5}body{margin:0}main{max-width:680px;margin:auto;padding:20px}article{background:#fff;border-radius:12px;padding:16px;margin:12px 0}label{display:block;margin:12px 0}input,button{font:inherit;padding:10px}button{background:#06a94d;color:#fff;border:0;border-radius:8px;min-height:44px}button:disabled{opacity:.5}[hidden]{display:none!important}#status,#enrollmentStatus,#connectionErrorMessage{white-space:pre-wrap}.muted{color:#58645e;font-size:.95rem}.times{font-weight:600}.nextday{font-size:.9em;color:#58645e}
#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#fff;padding:20px}
.loading-card{background:#fff;border-radius:12px;padding:24px;min-width:220px;text-align:center;box-shadow:0 4px 24px #0003}
#attendancePanel.connection-error > :not(#connectionError){display:none!important}
.spinner{width:28px;height:28px;margin:0 auto 12px;border:4px solid #dce6df;border-top-color:#06a94d;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="app">
<section id="enrollmentPanel" hidden>
<h1>LINE利用登録</h1>
<p>管理者から受け取った登録コードを入力してください。</p>
<form id="enrollment">
<label>登録コード <input id="enrollmentCode" autocomplete="one-time-code" maxlength="100" required></label>
<button id="enrollButton">利用登録</button>
</form>
<p id="enrollmentStatus" role="status" aria-live="polite"></p>
</section>
<section id="attendancePanel" hidden>
<section id="connectionError" role="alert" hidden><h1>通信エラーが発生しました。</h1><p id="connectionErrorMessage"></p><button id="retry" type="button">再接続</button></section>
<h1>勤務予定・実績</h1>
<p>勤務日と勤務時間を確認し、実際に働いた時間を入力してください。<br>保存すると、勤怠表に反映されます。</p>
<label class="muted">勤怠日 <input id="workDate" type="date" min="2026-10-01" value="2026-10-01" required></label>
<p class="muted">勤怠実績が登録されている場合は、登録済みの勤務時間を表示します。<br>未登録の場合は、シフト表の予定時間を表示します。</p>
<p id="status" role="status" aria-live="polite"></p>
<div id="list"></div>
</section>
<div id="loading" role="status" aria-live="polite" aria-atomic="true" hidden>
<div class="loading-card"><div class="spinner" aria-hidden="true"></div><div id="loadingMessage">読み込み中…</div></div>
</div>
</main>
<script>
'use strict';
const LIFF_ID='2012227652-CgVMkyBb';
const GAS_URL='https://script.google.com/macros/s/AKfycbzYQkx1NBTCGpqR6XGVXCgNP0s3PfE7_gZt2-FhhTkmFIKGhGoyqq6DA46rdNEXqqII/exec';
let token='',busy=false,requestSequence=0;
const app=document.getElementById('app');
const status=document.getElementById('status');
const enrollmentStatus=document.getElementById('enrollmentStatus');
const list=document.getElementById('list');
const retry=document.getElementById('retry');
const connectionError=document.getElementById('connectionError');
const connectionErrorMessage=document.getElementById('connectionErrorMessage');
const loading=document.getElementById('loading');
const loadingMessage=document.getElementById('loadingMessage');
const enrollmentPanel=document.getElementById('enrollmentPanel');
const attendancePanel=document.getElementById('attendancePanel');
const workDateInput=document.getElementById('workDate');
const BASE_DATE='2026-10-01';
const LOAD_ERROR='通信エラーが発生しました。サーバーに接続できませんでした。通信状態を確認し、「再接続」を押してください。';
const SAVE_UNKNOWN_ERROR='勤怠情報が保存されたか確認できませんでした。重複登録を防ぐため、再度保存せず、通信状態を確認して「再接続」を押してください。';
const messages={REGISTRATION_INVALID:'登録コードを確認できません。',ALREADY_REGISTERED:'このLINEアカウントは登録済みです。',DISABLED:'機能が停止中です。',AUTHENTICATION_FAILED:'LINE本人確認に失敗しました。',AUTHORIZATION_DENIED:'利用者設定を確認できません。',NOT_FOUND:'対象の勤務予定を確認できません。',CONFLICT:'別の操作で更新されています。勤怠情報を再取得してください。',UNAVAILABLE:'保存結果を確認できません。二重保存を避けるため再保存せず、勤怠表と変更履歴を確認してください。',SAVE_FAILED:'保存に失敗しました。勤怠管理表には反映されていません。入力内容を確認して再度保存してください。',SAVE_UNKNOWN:'保存結果を確定できません。二重保存を避けるため再保存せず、勤怠表と変更履歴を確認してください。',INVALID_REQUEST:'入力時刻を確認してください。'};
function setLoading(active,message='勤怠情報を読み込んでいます…'){loadingMessage.textContent=message;loading.hidden=!active;app.setAttribute('aria-busy',String(active));}
async function api(fields){const body=new URLSearchParams({id_token:token,...fields});const r=await fetch(GAS_URL,{method:'POST',body,redirect:'follow',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('通信結果を確認できません。');const result=await r.json();if(!result.ok){const message=result.code==='UNAVAILABLE'&&fields.action!=='saveActual'?'通信エラーが発生しました。サーバーに接続できませんでした。通信状態を確認し、「再接続」を押してください。':(messages[result.code]||'処理できませんでした。');const e=Error(message);e.code=result.code;throw e;}return result;}
function showConnectionError(message=LOAD_ERROR){attendancePanel.hidden=false;attendancePanel.classList.add('connection-error');connectionError.hidden=false;connectionErrorMessage.textContent=message;list.replaceChildren();status.textContent='';}
function clearConnectionError(){attendancePanel.classList.remove('connection-error');connectionError.hidden=true;}
function rangeText(start,end,next){return start+'–'+end+(next?'（翌日）':'');}
function render(records){
 list.replaceChildren();
 if(!records.length){list.textContent='この日の勤務予定はありません。';return;}
 for(const row of records){
  const card=document.createElement('article');
  const title=document.createElement('h2');title.textContent=row.displayName;card.appendChild(title);
  const date=document.createElement('p');date.textContent='勤務日: '+row.workDate;card.appendChild(date);
  const planned=document.createElement('p');planned.className='times';planned.textContent='予定: '+rangeText(row.plannedStart,row.plannedEnd,row.plannedEndNextDay);card.appendChild(planned);
  const form=document.createElement('form');
  const fields=[];
  for(const [caption,value] of [['実績開始',row.actualStart],['実績終了',row.actualEnd]]){
   const label=document.createElement('label');label.append(document.createTextNode(caption+' '));
   const input=document.createElement('input');input.type='time';input.required=true;input.value=value;label.appendChild(input);form.appendChild(label);fields.push(input);
  }
  if(row.saved){const saved=document.createElement('p');saved.className='muted';saved.textContent='保存済み・変更履歴 '+row.revision+' 件';card.appendChild(saved);}
  const button=document.createElement('button');button.textContent='実績を勤怠表へ保存';form.appendChild(button);
  form.addEventListener('submit',async e=>{
   e.preventDefault();if(busy)return;busy=true;button.disabled=true;workDateInput.disabled=true;retry.disabled=true;
   const saveDate=workDateInput.value;
   setLoading(true,'勤怠情報を保存しています…');
   try{await api({action:'saveActual',employeeId:row.employeeId,workDate:saveDate,actualStart:fields[0].value,actualEnd:fields[1].value,revision:String(row.revision)});const refreshed=await load(false,true);status.textContent=refreshed?'実績を保存し、勤怠表と変更履歴を再取得しました。':'実績は保存されましたが、画面の再取得に失敗しました。再保存せず、勤怠表を確認してください。';}
   catch(err){const refreshed=await load(false,true);const saved=refreshed&&refreshed.records.some(x=>x.employeeId===row.employeeId&&x.saved&&x.revision>row.revision&&x.actualStart===fields[0].value&&x.actualEnd===fields[1].value);if(saved){clearConnectionError();status.textContent='保存済みであることを再取得で確認しました。';}else if(err.code==='SAVE_FAILED'){clearConnectionError();status.textContent=err.message;}else{showConnectionError(SAVE_UNKNOWN_ERROR);}}
   finally{busy=false;button.disabled=false;workDateInput.disabled=false;retry.disabled=false;}
  });
  card.appendChild(form);list.appendChild(card);
 }
}
async function load(show=true,preserveOnError=false){
 const sequence=++requestSequence;
 const selectedDate=workDateInput.value;
 if(!selectedDate||selectedDate<BASE_DATE){status.textContent='勤怠日は2026-10-01以降を選択してください。';retry.hidden=true;return null;}
 retry.disabled=false;clearConnectionError();status.textContent='';setLoading(true,'勤怠情報を読み込んでいます…');
 try{
  const data=await api({action:'attendanceList',workDate:selectedDate});
  if(sequence!==requestSequence||selectedDate!==workDateInput.value)return null;
  enrollmentPanel.hidden=true;attendancePanel.hidden=false;render(data.records);
  if(show)status.textContent=data.records.length?data.records.length+'名分の勤務予定・実績を表示しています。':'';
  return data;
 }catch(e){
  if(sequence!==requestSequence||selectedDate!==workDateInput.value)return null;
  if(e.code==='AUTHORIZATION_DENIED'){list.replaceChildren();attendancePanel.hidden=true;enrollmentPanel.hidden=false;enrollmentStatus.textContent='';retry.hidden=true;return null;}
  list.replaceChildren();
  showConnectionError(LOAD_ERROR);
  return null;
 }finally{if(sequence===requestSequence)setLoading(false);}
}
document.getElementById('enrollment').addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;busy=true;
 const input=document.getElementById('enrollmentCode'),button=document.getElementById('enrollButton');
 button.disabled=true;input.disabled=true;enrollmentStatus.textContent='';
 setLoading(true,'利用登録を確認しています…');
 try{
  await api({action:'register',registrationCode:input.value.trim()});
  input.value='';enrollmentPanel.hidden=true;attendancePanel.hidden=false;
  setLoading(true,'勤怠情報を読み込んでいます…');
  await load();
 }catch(err){enrollmentStatus.textContent=(err.message||'利用登録を確認できませんでした。')+' 登録結果が不明な場合は管理者に確認してください。';}
 finally{setLoading(false);busy=false;button.disabled=false;input.disabled=false;}
});
document.getElementById('retry').addEventListener('click',()=>{if(!busy)load();});
workDateInput.addEventListener('change',()=>{if(!busy)load();});
async function start(){
 setLoading(true,'LINEに接続しています…');
 try{
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){liff.login();return;}
  token=liff.getIDToken()||'';if(!token)throw Error('LINE本人確認情報を取得できません。');
  await load();
 }catch(e){enrollmentPanel.hidden=true;showConnectionError(LOAD_ERROR);setLoading(false);}
}
start();
</script>
</body>
</html>
