<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://static.line-scdn.net; connect-src https://api.line.me; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>LINE本人認証 試験ページ</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #182230; background: #f5f7f9; }
    body { margin: 0; padding: 24px 16px; }
    main { max-width: 46rem; margin: 0 auto; }
    section { background: #fff; border: 1px solid #d8e0e7; border-radius: 12px; padding: 20px; margin: 14px 0; }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    h2 { font-size: 1.08rem; margin: 0 0 8px; }
    p { margin: .6rem 0; }
    .status { padding: 12px; border-left: 4px solid #147d64; background: #eaf8f3; }
    .muted { color: #526170; font-size: .94rem; }
    button { box-sizing: border-box; width: 100%; min-height: 46px; padding: 10px 12px; margin-top: 12px; border: 0; border-radius: 7px; background: #06c755; color: #082c18; font: inherit; font-weight: 700; }
    button:disabled { opacity: .72; cursor: wait; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>LINE本人認証 試験ページ</h1>
    <p class="status"><strong>準備完了。LIFFはボタンを押すまで初期化しません。</strong></p>
    <p>このページで確認するのはLIFF初期化とログイン状態だけです。ID tokenは取得・送信しません。</p>
  </section>
  <section>
    <h2>安全上の範囲</h2>
    <ul>
      <li>LINEログインが必要な場合だけLINEログインへ移動します。</li>
      <li>ID tokenの取得、GASへの送信、ユーザー情報の取得は行いません。</li>
      <li>認証情報や内部エラーの詳細を画面、URL、console、保存領域に出しません。</li>
    </ul>
  </section>
  <section>
    <h2>LIFF初期化・ログイン状態</h2>
    <p id="result" role="status" aria-live="polite">まだLIFFを初期化していません。開始ボタンを押してください。</p>
    <button id="verify" type="button">本人認証を開始</button>
  </section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script src="./line-id-token-auth-test.js" defer></script>
</body>
</html>
