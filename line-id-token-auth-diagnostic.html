<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <!-- GAS ContentService can redirect its response to script.googleusercontent.com. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>隔離GAS 通信診断</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #182230; background: #f5f7f9; }
    body { margin: 0; padding: 24px 16px; }
    main { max-width: 46rem; margin: 0 auto; }
    section { background: #fff; border: 1px solid #d8e0e7; border-radius: 12px; padding: 20px; margin: 14px 0; }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    p { margin: .6rem 0; }
    .status { padding: 12px; background: #eaf8f3; }
    .muted { color: #526170; font-size: .94rem; }
    button { box-sizing: border-box; width: 100%; min-height: 46px; padding: 10px 12px; margin-top: 12px; border: 0; border-radius: 7px; background: #1769aa; color: #fff; font: inherit; font-weight: 700; }
    button:disabled { opacity: .65; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>隔離GAS 通信診断</h1>
    <p>本人認証エラーの原因切り分け用です。LINE SDK、ログイン、ID tokenの取得・送信は行いません。</p>
    <p class="muted">実行する場合は固定文字列だけを隔離GASへ一度送信します。GASの実行履歴に新しい doPost が追加される可能性があります。</p>
  </section>
  <section>
    <p id="result" class="status" role="status" aria-live="polite">未実行。固定文字列の通信確認だけを実行できます。</p>
    <button id="probe" type="button">固定文字列で応答確認</button>
    <button type="button" disabled>本人認証テスト（無効）</button>
  </section>
</main>
<script>
(() => {
  'use strict';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzWMpCtYx-ZQpu1duylWq5BBXT9UmXsie4hF3Vjcuj80q3GpVNHTEekLvInemris23S/exec';
  const result = document.getElementById('result');
  const button = document.getElementById('probe');
  const PROBE = 'codex-fixed-probe-v1';

  button.addEventListener('click', async () => {
    if (!window.confirm('固定文字列だけを隔離GASへ送信します。LINE ID tokenや個人情報は扱いません。続行しますか？')) return;
    button.disabled = true;
    result.textContent = '固定文字列を送信し、リダイレクト後の応答を確認しています。';
    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: new URLSearchParams({ probe: PROBE }).toString(),
        redirect: 'follow',
        credentials: 'omit',
        referrerPolicy: 'no-referrer',
        cache: 'no-store'
      });
      const raw = await response.text();
      let payload;
      try {
        payload = JSON.parse(raw.replace(/^\uFEFF/, '').trim());
      } catch (_) {
        result.textContent = '応答本文は届きましたが、JSONではありませんでした。HTTP状態は ' + response.status + ' です。';
        return;
      }
      if (response.ok && payload && payload.probe === PROBE && payload.received === true) {
        result.textContent = '成功：固定文字列のPOSTとJSON応答読取を確認しました。本人認証の成功を意味しません。';
      } else {
        result.textContent = 'JSON応答を読み取りましたが、固定文字列の確認形式と一致しません。HTTP状態は ' + response.status + ' です。';
      }
    } catch (_) {
      result.textContent = '通信または応答読取に失敗しました。CSP、CORS、ネットワーク、リダイレクト後の接続先を確認してください。トークンや内部エラーは表示していません。';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
