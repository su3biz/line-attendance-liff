<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>出勤イベント隔離検証</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{margin:0;padding:20px;background:#f5f7f8;color:#17202a;font:16px system-ui,sans-serif}
main{max-width:520px;margin:auto}.card{background:white;border:1px solid #d9e0e5;border-radius:12px;padding:18px;margin:14px 0}
button{width:100%;min-height:48px;border:0;border-radius:8px;background:#06c755;color:white;font:inherit;font-weight:700}
button:disabled{opacity:.5}.muted{color:#53616b;font-size:.92rem}
</style>
</head>
<body><main>
<section class="card"><h1>出勤イベント隔離検証</h1>
<p class="muted">このページは専用のアクセス制限された試験ホストでのみ使用します。公開PagesではGAS送信先が未設定のため、送信ボタンは動作しません。</p></section>
<section class="card" aria-live="polite"><p id="status">LIFFの設定を確認しています。</p>
<button id="clock-in" type="button" disabled>出勤を記録</button></section>
</main>
<script>
(() => {
'use strict';
// Replace only in a controlled, access-restricted test build. Never use a public host
// for an ID-token request. Keep this placeholder in the repository.
const LIFF_ID='2012227652-CgVMkyBb';
const GAS_ENDPOINT_URL='REPLACE_WITH_REVIEWED_ISOLATED_GAS_URL';
const PENDING_KEY='isolated-clock-in-request-id-v1';
const COMPLETED_KEY='isolated-clock-in-completed-v1';
const status=document.getElementById('status');
const button=document.getElementById('clock-in');
let busy=false;
function endpointConfigured(){
  try {
    const u=new URL(GAS_ENDPOINT_URL);
    return GAS_ENDPOINT_URL!=='REPLACE_WITH_REVIEWED_ISOLATED_GAS_URL'&&
      u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.google.com'));
  } catch(_){return false;}
}
function requestId(){
  let id=sessionStorage.getItem(PENDING_KEY);
  if(!id){id=crypto.randomUUID();sessionStorage.setItem(PENDING_KEY,id);}
  return id;
}
async function start(){
  button.disabled=true;
  if(typeof liff==='undefined'){status.textContent='LINE SDKを読み込めませんでした。';return;}
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){status.textContent='LINEログインが必要です。LINEアプリ内で開き直してください。';return;}
    if(sessionStorage.getItem(COMPLETED_KEY)==='true'){
      status.textContent='この画面では出勤操作を記録済みです。';
      return;
    }
    if(!endpointConfigured()){
      status.textContent='送信先未設定のため停止中です。公開ページからは送信できません。';
      return;
    }
    status.textContent='隔離試験先が設定されています。本人の出勤操作を行う場合のみ押してください。';
    button.disabled=false;
  }catch(_){status.textContent='LIFF初期化を確認できませんでした。';}
}
button.addEventListener('click',async()=>{
  if(busy||!endpointConfigured()||typeof liff==='undefined'||!liff.isLoggedIn())return;
  busy=true;button.disabled=true;status.textContent='送信結果を確認しています。';
  try{
    const token=liff.getIDToken();
    if(!token)throw new Error('token unavailable');
    const body=new URLSearchParams({mode:'clock_in',id_token:token,requestId:requestId()});
    const response=await fetch(GAS_ENDPOINT_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body,redirect:'follow',credentials:'omit',cache:'no-store'});
    const result=await response.json();
    if(result.outcome==='CLOCK_IN_RECORDED'){
      sessionStorage.setItem(COMPLETED_KEY,'true');
      status.textContent='出勤イベントを記録しました。';
    }else if(result.outcome==='ALREADY_RECORDED'){
      sessionStorage.setItem(COMPLETED_KEY,'true');
      status.textContent='同じ操作は記録済みです。';
    }else if(result.outcome==='REQUEST_ID_CONFLICT'){
      status.textContent='操作IDが別の出勤記録に使われています。管理者へお問い合わせください。';
    }else if(result.outcome==='AUTHORIZATION_DENIED'||result.outcome==='UNREGISTERED'){
      status.textContent='この利用者は出勤を記録できません。';
    }else if(result.outcome==='AUTHENTICATION_FAILED'){
      status.textContent='本人確認に失敗しました。';
    }else if(result.outcome==='CLOCK_IN_UNAVAILABLE'){
      status.textContent='記録先を利用できません。再試行では同じ操作IDを使います。';
    }else{
      status.textContent='結果を確定できません。再試行では同じ操作IDを使います。';
    }
  }catch(_){status.textContent='応答を確認できません。再試行では同じ操作IDを使います。';}
  finally{busy=false;button.disabled=sessionStorage.getItem(COMPLETED_KEY)==='true'||!endpointConfigured();}
});
start();
})();
</script></body></html>
